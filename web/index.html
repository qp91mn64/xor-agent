<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>XOR 画布 · AI 选图案实时可视化</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: Consolas, "Microsoft YaHei", monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: #9cf; }
  #status { margin-bottom: 12px; font-size: 13px; color: #fc9; }
  .cards { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; }
  img#canvas-img { image-rendering: pixelated; border: 1px solid #444; }
  canvas { border: 1px solid #444; background: #000; }
  #timeline { max-height: 460px; overflow-y: auto; width: 480px; font-size: 12px; }
  .group { border-bottom: 1px dashed #333; padding: 4px 0; }
  .ghead { color: #9cf; font-weight: bold; }
  .cells { margin: 2px 0; }
  .cell b { color: #fc9; }
  .prev { color: #888; }
  .why { color: #8c8; margin-top: 2px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>XOR 画布 · AI 选图案实时可视化</h1>
<div id="status">等待 agent 启动...</div>
<div id="nokey" style="display:none;background:#2a1f00;border:1px solid #fc9;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px;">
  <b>缺少 DEEPSEEK_API_KEY</b>：下方为初始画布预览，agent 尚未开始。<br>
  配置步骤：① 在项目目录执行 <code>copy env.example .env</code>；② 编辑 <code>.env</code> 填入 API key 并保存；③ 本页将自动检测到 API key 并开始运行，无需重启程序。
</div>
<div class="cards">
  <div class="card"><h2>当前画布（512×512）</h2><img id="canvas-img" alt="" width="512" height="512"></div>
  <div class="card"><h2>参数热力图（值 -64..63：低红高蓝）</h2><canvas id="heatmap" width="256" height="256"></canvas></div>
  <div class="card"><h2>AI 决策过程：思考 + 点击</h2><div id="timeline"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
// --- SSE 实时推送（主通道） ---
// agent 端 /events 端点：每个思考 delta 到达即推 reasoning 事件（含轮次与全文），
// 每次快照即推 state 事件（画布状态全文）。显示速度 = delta 到达速度 = 终端速度。
// 轮询降为 3s 兜底：EventSource 断线自动重连，重连间隙靠轮询保证最终一致。
let liveRound = -1, liveText = '';
let lastState = null;
let pendingRender = false;
const es = new EventSource('/events');
es.addEventListener('reasoning', e => {
  const d = JSON.parse(e.data);
  liveRound = d.round;
  liveText = d.reasoning || '';
  scheduleRender();
});
es.addEventListener('state', e => {
  lastState = JSON.parse(e.data);
  scheduleRender();
});
function scheduleRender() {
  // requestAnimationFrame 合并渲染：delta 频率高于 60fps 时只渲染最新状态
  if (pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(() => { pendingRender = false; if (lastState) render(lastState); });
}
// --- 智能跟随滚动 ---
// autoFollow=true（容器距底 < 40px）：新内容渲染后自动滚到底，看最新不用手动翻。
// 用户翻历史（滚离底部）→ autoFollow=false 暂停跟随，内容照常追加、不打扰；
// 滚回底部附近（距底 < 40px）自动恢复跟随。
const TIMELINE = $('timeline');
let autoFollow = true;
let lastImage = '';  // 图片按需刷新：画布快照名变化才重载 512×512 PNG
TIMELINE.addEventListener('scroll', () => {
  autoFollow = TIMELINE.scrollHeight - TIMELINE.scrollTop - TIMELINE.clientHeight < 40;
});
function scrollToBottomIfFollow() {
  if (autoFollow) TIMELINE.scrollTop = TIMELINE.scrollHeight;
}
async function refreshLive() {
  try {
    const r = await fetch('/output/reasoning_live.json', { cache: 'no-store' });
    if (!r.ok) { liveRound = -1; liveText = ''; return; }
    const d = await r.json();
    liveRound = d.round;
    liveText = d.reasoning || '';
  } catch (e) { liveRound = -1; liveText = ''; }
}
async function refresh() {
  try {
    const r = await fetch('/output/state.json', { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    lastState = s;  // 兜底轮询与 SSE 共用 lastState，页面初始化/重连间隙保证有状态
    render(s);
  } catch (e) { /* 服务未就绪 */ }
}
function render(s) {
  const nokey = s.status === 'no_key';
  $('nokey').style.display = nokey ? '' : 'none';
  $('status').textContent = nokey
    ? '状态: 等待配置 DEEPSEEK_API_KEY'
    : `状态: ${s.status} · 点击 ${s.clicks.length} 次` +
      (s.final_reason ? ` · 结束原因: ${s.final_reason}` : '');
  if (s.image !== lastImage) {  // 快照名变才重载图片：轮询加速后避免每次重载 512×512 PNG
    lastImage = s.image;
    $('canvas-img').src = s.image + '?t=' + Date.now();
  }
  drawHeatmap(s.grid, s.seed_index);
  drawTimeline(s.clicks);
}
function drawHeatmap(grid, seed) {
  const c = $('heatmap'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const cell = 32;
  for (let i = 0; i < 64; i++) {
    const t = (grid[i] + 64) / 128;  // 0..1
    ctx.fillStyle = `hsl(${Math.round(t * 240)}, 75%, 45%)`;
    ctx.fillRect((i % 8) * cell, Math.floor(i / 8) * cell, cell, cell);
    ctx.fillStyle = '#000';
    ctx.font = '11px monospace';
    ctx.fillText(i, (i % 8) * cell + 3, Math.floor(i / 8) * cell + 12);
    ctx.fillText(grid[i], (i % 8) * cell + 3, Math.floor(i / 8) * cell + 26);
    if (i === seed) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect((i % 8) * cell + 1, Math.floor(i / 8) * cell + 1, cell - 2, cell - 2);
    }
  }
}
function drawTimeline(clicks) {
  // 按 round 分组：同一轮（一次 API 请求）的多次点击共享一次思考，合并显示。
  // 进行中轮（reasoning_live 有内容）的思考显示当前累积全文（跟随 delta 到达）；历史轮显示完整思考。
  const groups = [];
  for (const c of clicks) {
    const last = groups[groups.length - 1];
    if (last && last.round === c.round) {
      last.items.push(c);
    } else {
      groups.push({ round: c.round, reasoning: c.reasoning || '', items: [c] });
    }
  }
  const parts = [];
  for (const g of groups.slice(-20)) {
    const isLive = liveRound > 0 && g.round === liveRound;
    const reason = isLive ? liveText : g.reasoning;
    const head = `第 ${g.round ?? '?'} 轮 · ${g.items.length} 格` + (isLive ? ' · 思考中…' : '');
    parts.push(
      '<div class="group">' +
      `<div class="ghead">${head}</div>` +
      (reason ? `<div class="why">${esc(reason)}</div>` : '') +
      '<div class="cells">' + g.items.map(c =>
        `#${c.index}→<b>${c.value}</b><span class="prev">(原${c.prev})</span>`
      ).join(' ') + '</div></div>'
    );
  }
  // 当前轮还没有任何点击（刚开新一轮，或 evaluate/view 轮）：单独追加一组，实时显示思考
  if (liveRound > 0 && !groups.some(g => g.round === liveRound)) {
    parts.push(
      '<div class="group">' +
      `<div class="ghead">第 ${liveRound} 轮 · 0 格 · 思考中…</div>` +
      (liveText ? `<div class="why">${esc(liveText)}</div>` : '') +
      '</div>'
    );
  }
  $('timeline').innerHTML = parts.join('') || '<div style="color:#888">暂无数据</div>';
  scrollToBottomIfFollow();  // 新内容渲染后：在底部则跟随到底，翻历史则保持不动
}
function esc(s) {
  return (s || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
async function tick() {
  await refreshLive();  // 兜底轮询思考：SSE 断线重连间隙的最终一致
  await refresh();
}
setInterval(tick, 3000);  // 兜底低频轮询（SSE 为主通道，实时推送；断线重连间隙靠它兜底）
tick();  // 页面初始加载拉一次全量（SSE 无历史事件）
</script>
</body>
</html>
