<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>XOR 画布 · AI 选图案实时可视化</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: Consolas, "Microsoft YaHei", monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: #9cf; }
  #status { margin-bottom: 12px; font-size: 13px; color: #fc9; }
  .cards { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; }
  canvas#canvas-main { image-rendering: pixelated; }
  canvas { border: 1px solid #444; background: #000; }
  #timeline { max-height: 460px; overflow-y: auto; width: 480px; font-size: 12px; }
  #timeline-box { position: relative; }
  #follow-btn {
    position: absolute; right: 8px; bottom: 8px; z-index: 2;
    background: #9bf; color: #0a0a0a; border: none; border-radius: 4px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  #follow-btn:hover { background: #acf; }
  .group { border-bottom: 1px dashed #333; padding: 4px 0; }
  .ghead { color: #9cf; font-weight: bold; }
  .cells { margin: 2px 0; }
  .cell b { color: #fc9; }
  .why { color: #8c8; margin-top: 2px; white-space: pre-wrap; }
  .answer { color: #ddd; margin-top: 4px; white-space: pre-wrap; border-left: 3px solid #9cf; padding-left: 8px; }
</style>
</head>
<body>
<h1>XOR 画布 · AI 选图案实时可视化</h1>
<div id="status">等待 agent 启动...</div>
<div id="nokey" style="display:none;background:#2a1f00;border:1px solid #fc9;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px;">
  <b>缺少 DEEPSEEK_API_KEY</b>：下方为初始画布预览，agent 尚未开始。<br>
  配置步骤：① 在项目目录执行 <code>copy env.example .env</code>；② 编辑 <code>.env</code> 填入 API key 并保存；③ 本页将自动检测到 API key 并开始运行，无需重启程序。
</div>
<div class="cards">
  <div class="card"><h2>当前画布（512×512）</h2><canvas id="canvas-main" width="512" height="512"></canvas></div>
  <div class="card"><h2>参数示意图</h2><canvas id="paramgrid" width="256" height="256"></canvas></div>
  <div class="card"><h2>AI 决策过程：思考 + 点击</h2><div id="timeline-box"><div id="timeline"></div><button id="follow-btn" hidden>↓ 回到底部</button></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
// --- SSE 实时推送（主通道） ---
// agent 端 /events 端点：每个思考 delta 到达即推 reasoning 事件（含轮次与全文），
// 每次快照即推 state 事件（画布状态全文）。显示速度 = delta 到达速度 = 终端速度。
// 轮询降为 3s 兜底：EventSource 断线自动重连，重连间隙靠轮询保证最终一致。
let liveRound = -1, liveText = '';
let lastState = null;
let pendingRender = false;
const es = new EventSource('/events');
es.addEventListener('reasoning', e => {
  const d = JSON.parse(e.data);
  liveRound = d.round;
  liveText = d.reasoning || '';
  scheduleRender();
});
es.addEventListener('state', e => {
  lastState = JSON.parse(e.data);
  scheduleRender();
});
function scheduleRender() {
  // requestAnimationFrame 合并渲染：delta 频率高于 60fps 时只渲染最新状态
  if (pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(() => { pendingRender = false; if (lastState) render(lastState); });
}
// --- 智能跟随滚动 ---
// autoFollow=true：新内容渲染后自动滚到底，看最新不用手动翻。
// 暂停：向上滚动且距底 >= 40px（PAUSE_DIST）→ 暂停跟随，内容照常追加、不打扰；
// 恢复：向下滚动且距底 < 150px（RESUME_DIST）→ 恢复跟随（方向感知，避免"内容持续追加、底部是移动靶"时够不到底）；
// 兜底：暂停时时间线右下角浮现「↓ 回到底部」按钮，点击必回底并恢复跟随。
const TIMELINE = $('timeline');
const PAUSE_DIST = 40;    // 距底 >= 此值且向上滚 → 暂停跟随
const RESUME_DIST = 150;  // 距底 < 此值且向下滚 → 恢复跟随
let autoFollow = true;
let lastScrollTop = 0;  // 记录最近一次滚动位置以判断方向；程序化滚动时同步更新，防方向误判
TIMELINE.addEventListener('scroll', () => {
  const dist = TIMELINE.scrollHeight - TIMELINE.scrollTop - TIMELINE.clientHeight;
  const dirDown = TIMELINE.scrollTop > lastScrollTop;
  lastScrollTop = TIMELINE.scrollTop;
  if (dirDown) { if (dist < RESUME_DIST) autoFollow = true; }
  else { if (dist >= PAUSE_DIST) autoFollow = false; }
  $('follow-btn').hidden = autoFollow;
});
function scrollToBottomIfFollow() {
  if (autoFollow) {
    TIMELINE.scrollTop = TIMELINE.scrollHeight;
    lastScrollTop = TIMELINE.scrollTop;
  }
  $('follow-btn').hidden = autoFollow;
}
$('follow-btn').addEventListener('click', () => {
  autoFollow = true;
  TIMELINE.scrollTop = TIMELINE.scrollHeight;
  lastScrollTop = TIMELINE.scrollTop;
  $('follow-btn').hidden = true;
});
async function refreshLive() {
  try {
    const r = await fetch('/output/reasoning_live.json', { cache: 'no-store' });
    if (!r.ok) { liveRound = -1; liveText = ''; return; }
    const d = await r.json();
    liveRound = d.round;
    liveText = d.reasoning || '';
  } catch (e) { liveRound = -1; liveText = ''; }
}
async function refresh() {
  try {
    const r = await fetch('/output/state.json', { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    lastState = s;  // 兜底轮询与 SSE 共用 lastState，页面初始化/重连间隙保证有状态
    render(s);
  } catch (e) { /* 服务未就绪 */ }
}
function render(s) {
  const nokey = s.status === 'no_key';
  $('nokey').style.display = nokey ? '' : 'none';
  $('status').textContent = nokey
    ? '状态: 等待配置 DEEPSEEK_API_KEY'
    : `状态: ${s.status} · 点击 ${s.clicks.length} 次 · 已覆盖 ${new Set(s.clicks.map(c => c.index)).size}/${s.grid.length - 1} 格` +
      (s.final_reason ? ` · 结束原因: ${s.final_reason}` : '');
  drawCanvas(s.grid);
  drawParamGrid(s.grid, s.seed_index);
  drawTimeline(s);
}
function drawCanvas(grid) {
  // 主画布：用 grid 在 canvas 复刻后端 (dx^dy) & a 渲染（512×512，每区 64×64 像素），无需后端 PNG。
  // 负值 mask 必须写 -a-1（numpy 语义），不能用 JS 的 ~a（32 位补码，~(-1) 是 -2 而非 0）。
  const c = $('canvas-main'), ctx = c.getContext('2d');
  const img = ctx.createImageData(512, 512);
  const data = img.data;
  const px = 64;
  for (let i = 0; i < 64; i++) {
    const a = grid[i];
    const mask = a >= 0 ? a : -a - 1;
    const invert = a < 0;
    const x0 = (i % 8) * px, y0 = ((i / 8) | 0) * px;
    for (let dy = 0; dy < px; dy++) {
      for (let dx = 0; dx < px; dx++) {
        const white = ((dx ^ dy) & mask) !== 0;
        const v = white !== invert ? 255 : 0;  // a<0 反色
        const p = ((y0 + dy) * 512 + (x0 + dx)) * 4;
        data[p] = data[p + 1] = data[p + 2] = v;
        data[p + 3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}
// 白像素占比：只取决于 mask 的二进制 1 个数（128 个值暴力遍历校验一致）。原理：每个 dy 行
// dx^dy 是 0..63 的一个置换，mask 置位的 k 个二进制位约束了 (dx^dy)&mask==0 的数量 = 2^(6-k)；a<0 反色取补。
function whiteRatio(a) {
  const m = a >= 0 ? a : -a - 1;
  let k = 0;
  for (let t = m; t > 0; t >>= 1) k += t & 1;
  const base = (64 - (1 << (6 - k))) / 64;
  return a >= 0 ? base : 1 - base;
}
function drawParamGrid(grid, seed) {
  const c = $('paramgrid'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const cell = 32;
  for (let i = 0; i < 64; i++) {
    const a = grid[i];
    const x = (i % 8) * cell, y = Math.floor(i / 8) * cell;
    // 灰度 = 白像素占比，语义自明（亮格=亮图案）；文字黑/白随底明暗，种子边框同理
    const g = Math.round(whiteRatio(a) * 255);
    const bright = g > 127;
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.fillRect(x, y, cell, cell);
    ctx.fillStyle = bright ? '#000' : '#fff';
    ctx.font = '11px monospace';
    ctx.fillText(i, x + 3, y + 12);
    ctx.fillText(a, x + 3, y + 26);
    if (i === seed) {
      ctx.strokeStyle = bright ? '#000' : '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, cell - 2, cell - 2);
    }
  }
}
function timelineModel(s) {
  // 时间线数据源 = state.rounds（每轮一条：思考 + 点击轨迹 + 模型正文）；
  // 渲染顺序 = 真实发生的顺序：思考（流式）→ 点击轨迹 → 模型正文。
  // 不再从 clicks[].reasoning 取思考：只查看/只评估/只输出总结的轮次没有点击，
  // 那条通道会让这些轮的思考在界面上静默消失（2026-10-17 修复）。
  // 兼容旧 state.json（clicks 里带 reasoning、无 rounds）：由 clicks 回退重建分组。
  const clicks = s.clicks || [];
  const rounds = s.rounds || [];
  const byRound = new Map();
  const blank = r => ({ round: r, reasoning: '', content: '', calls: [], tools: {}, clicks: [] });
  for (const r of rounds) {
    byRound.set(r.round, { round: r.round, reasoning: r.reasoning || '', content: r.content || '',
                           calls: r.calls || [], tools: r.tools || {}, clicks: [] });
  }
  if (!rounds.length) {  // 旧格式回退：思考挂在 clicks 上
    for (const c of clicks) {
      if (!byRound.has(c.round)) byRound.set(c.round, Object.assign(blank(c.round), { reasoning: c.reasoning || '' }));
      byRound.get(c.round).clicks.push(c);
    }
  } else {
    for (const c of clicks) {
      if (!byRound.has(c.round)) byRound.set(c.round, blank(c.round));
      byRound.get(c.round).clicks.push(c);
    }
  }
  const items = [...byRound.values()];
  // 进行中的轮（思考正在流式到达、该轮记录还没落盘）：把实时全文并进**同一轮**那一组，
  // 不新开一组——否则会出现两个「第 N 轮」小标题，且后到的点击组把思考与点击割开，
  // 点击行看起来"夹在中间"（2026-10-17 用户实测：流式过程中老问题复现）。
  const maxRecorded = rounds.length ? Math.max(...rounds.map(r => r.round)) : -1;
  const maxSeen = items.length ? Math.max(...items.map(g => g.round)) : -1;
  const liveGroup = items.find(g => g.round === liveRound);
  if (liveGroup && liveRound > maxRecorded) {
    liveGroup.reasoning = liveText;  // 本轮流式进行中：实时全文覆盖显示
    liveGroup.live = true;
  } else if (!liveGroup && liveText && liveRound > maxSeen) {
    items.push({ round: liveRound, reasoning: liveText, content: '', calls: [], tools: {},
                 clicks: [], live: true });
  }
  items.sort((a, b) => (a.round ?? 0) - (b.round ?? 0));
  // 不截断历史轮次：信息可见优先于渲染量（卡内可滚动、可翻到底）。
  // 曾硬编码只渲染最新 20 组，`--rounds 30` 时前 10 轮会再次无声消失。
  return items;
}
function toolBrief(tools) {
  // 组头的"这轮做了什么"概览（如「设定×16」）；每次调用的参数与结果按顺序排在下面
  const order = ['view_region', 'evaluate', 'set_region'];
  const names = { set_region: '设定', view_region: '查看', evaluate: '评估' };
  const keys = order.filter(k => (tools || {})[k])
    .concat(Object.keys(tools || {}).filter(k => !order.includes(k)));
  return keys.map(k => `${names[k] || k}×${tools[k]}`).join(' ');
}
function groupHead(g, isLive) {
  // 标题一行给全"这轮做了什么"：格数 + 工具调用次数（如「15 格 · 设定×15」「评估×1」）
  const n = g.clicks.length;
  const brief = toolBrief(g.tools);
  const stats = [n ? `${n} 格` : '', brief].filter(Boolean).join(' · ');
  return `第 ${g.round ?? '?'} 轮` + (stats ? ` · ${stats}` : '') + (isLive ? ' · 思考中…' : '');
}
let liveWhyEl = null;  // 进行中轮次的思考节点：delta 到达只更新该节点文本，不整体重绘时间线
function renderGroups(items) {
  // 每轮按时间顺序：思考 → 点击轨迹（紧凑一行）→ 模型正文。
  // **不展开工具调用与结果**（如「评估进度 → 已设定 0/63 …」）：人类读者要的是轨迹，
  // 完整参数与结果留在 output/<运行ID>/state.json 的 rounds[].calls 里，按需查看。
  return items.map(g => {
    const cells = g.clicks.length
      ? '<div class="cells">' + g.clicks.map(c =>
          `#${c.index}→<b>${c.value}</b><span class="prev">(原${c.prev})</span>`).join(' ') + '</div>'
      : '';
    return '<div class="group">' +
      `<div class="ghead">${groupHead(g, !!g.live)}</div>` +
      (g.reasoning ? `<div class="why"${g.live ? ' id="live-why"' : ''}>${esc(g.reasoning)}</div>` : '') +
      cells +
      (g.content ? `<div class="answer">${esc(g.content)}</div>` : '') +
      '</div>';
  }).join('');
}
let lastSig = '';  // 时间线结构签名：相同则只做定点文本更新（见 drawTimeline）
function drawTimeline(s) {
  // 结构签名刻意不含「进行中轮次」的思考长度：流式期间签名不变 → 不重建 DOM，
  // 只把最新全文写进 #live-why 文本节点。轮次落盘/新点击/新轮次出现才重建。
  const items = timelineModel(s);
  const sig = JSON.stringify(items.map(g => [g.round, g.live ? -1 : g.reasoning.length,
                                             g.content.length, g.clicks.length, g.live, toolBrief(g.tools)]));
  if (sig !== lastSig) {
    lastSig = sig;
    TIMELINE.innerHTML = renderGroups(items) || '<div style="color:#888">暂无数据</div>';
    liveWhyEl = $('live-why');
  } else {
    const live = items.find(g => g.live);
    if (live && liveWhyEl && liveWhyEl.textContent !== live.reasoning) {
      liveWhyEl.textContent = live.reasoning;  // 显示速度 = delta 到达速度 = 终端速度
    }
  }
  scrollToBottomIfFollow();  // 新内容渲染后：在底部则跟随到底，翻历史则保持不动
}
function esc(s) {
  return (s || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
async function tick() {
  await refreshLive();  // 兜底轮询思考：SSE 断线重连间隙的最终一致
  await refresh();
}
setInterval(tick, 3000);  // 兜底低频轮询（SSE 为主通道，实时推送；断线重连间隙靠它兜底）
tick();  // 页面初始加载拉一次全量（SSE 无历史事件）
</script>
</body>
</html>
